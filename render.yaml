services:
  - type: web
    name: nutrisync-ai
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: node server.js
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: SPOONACULAR_API_KEY
        sync: false
      - key: NODE_ENV
        value: production
    plan: free
